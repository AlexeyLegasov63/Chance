version = "0.2.1"
license = "MIT"
authors = ["alexeylegasov63"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = [
    "**",
	"Charm.luau",
    "Ripple.luau"
]
include = [
    "src", 
    "src/**", 
    "CHANGELOG", 
    "default.project.json", 
    "wally.toml"
]

[dependencies]
Charm = "littensy/charm@0.10.0"
Ripple = "littensy/ripple@0.10.2"
